name: Docker distribution

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/abay11/onvif_server_emulator

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v0.1.0"
            exit 1
          fi

      - name: Check source packaging behavior
        run: PYTHONDONTWRITEBYTECODE=1 python3 unit_tests/source_packaging_tests.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: onvif-ci:latest
          build-args: |
            CMAKE_BUILD_TYPE=Release
            BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=onvif-runtime-amd64
          cache-to: type=gha,scope=onvif-runtime-amd64,mode=max

      - name: Start runtime image
        run: |
          # The network smoke test sends anonymous SOAP requests.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("server_configs/common.config").read_text())
          config["authentication"] = "none"
          destination = Path(os.environ["RUNNER_TEMP"]) / "onvif-network-common.config"
          destination.write_text(json.dumps(config, indent=2) + "\n")
          PY
          docker run --detach --init \
            --name onvif-ci \
            --network host \
            --mount "type=bind,src=$RUNNER_TEMP/onvif-network-common.config,dst=/app/server_configs/common.config,readonly" \
            -e ONVIF_ADVERTISED_IPV4=127.0.0.1 \
            -e ONVIF_DISCOVERY_INTERFACE_IPV4=127.0.0.1 \
            onvif-ci:latest

      - name: Wait for HTTP
        run: |
          curl --fail --silent --show-error \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 60 \
            --connect-timeout 2 \
            --max-time 2 \
            http://127.0.0.1:8080/snapshot.jpeg \
            --output /tmp/onvif-snapshot.jpeg

      - name: Check network behavior
        run: |
          timeout 180s python3 unit_tests/network_smoke.py \
            --host 127.0.0.1 \
            --advertised-ip 127.0.0.1 \
            --multicast-interface 127.0.0.1

      - name: Show container logs
        if: always()
        run: docker logs onvif-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force onvif-ci || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare exact corresponding sources
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx build -f docker/Dockerfile --target source-bundle \
            --build-arg CMAKE_BUILD_TYPE=Release --build-arg BUILD_JOBS=2 \
            --cache-from type=gha,scope=onvif-runtime-amd64 \
            --output type=local,dest=output/release-sources .
          cd output/release-sources
          sha256sum --check SHA256SUMS
          docker run --rm --network none --read-only --entrypoint sha256sum onvif-ci:latest \
            /app/main /usr/local/lib/gstreamer-1.0/libgstrsonvif.so > /tmp/osrv-runtime-sha256
          cmp BINARY_SHA256SUMS /tmp/osrv-runtime-sha256
          docker run --rm --network none --read-only --entrypoint cat onvif-ci:latest \
            /usr/local/share/onvif-server-emulator/debian-source-packages.tsv > /tmp/osrv-runtime-packages.tsv
          cmp debian-source-packages.tsv /tmp/osrv-runtime-packages.tsv

      - name: Publish source companion before the binary image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_SOURCES.md
          fi
          gh release upload "$GITHUB_REF_NAME" output/release-sources/*

      - name: Publish tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          docker tag onvif-ci:latest "$IMAGE:$version"
          docker tag onvif-ci:latest "$IMAGE:latest"

          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
