name: Docker distribution

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abay11/onvif_server_emulator

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v0.1.0"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: onvif-ci:latest
          build-args: |
            CMAKE_BUILD_TYPE=Release
            BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=onvif-runtime-amd64
          cache-to: type=gha,scope=onvif-runtime-amd64,mode=max

      - name: Start runtime image
        run: |
          docker run --detach --init \
            --name onvif-ci \
            --network host \
            -e ONVIF_ADVERTISED_IPV4=127.0.0.1 \
            -e ONVIF_DISCOVERY_INTERFACE_IPV4=127.0.0.1 \
            onvif-ci:latest

      - name: Wait for HTTP
        run: |
          curl --fail --silent --show-error \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 60 \
            --connect-timeout 2 \
            --max-time 2 \
            http://127.0.0.1:8080/snapshot.jpeg \
            --output /tmp/onvif-snapshot.jpeg

      - name: Check network behavior
        run: |
          timeout 180s python3 unit_tests/network_smoke.py \
            --host 127.0.0.1 \
            --advertised-ip 127.0.0.1 \
            --multicast-interface 127.0.0.1

      - name: Show container logs
        if: always()
        run: docker logs onvif-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force onvif-ci || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          docker tag onvif-ci:latest "$IMAGE:$version"
          docker tag onvif-ci:latest "$IMAGE:latest"

          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"